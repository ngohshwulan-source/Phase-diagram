<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox</title>

<script>
  (function () {
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark = stored ? stored === 'dark' : prefersDark;
    if (isDark) document.documentElement.classList.add('dark');
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
  [hidden] { display: none !important; }
</style>
</head>
<body class="font-sans bg-[#FAFAF9] dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen">

  <header class="sticky top-0 z-10 border-b border-zinc-200 dark:border-zinc-700 bg-[#FAFAF9]/90 dark:bg-zinc-900/90 backdrop-blur">
    <div class="max-w-3xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="#/" class="font-mono font-bold text-xl tracking-tight">Toolbox</a>
      <div class="flex items-center gap-3">
        <button id="back-home-btn" hidden
                class="font-mono text-xs px-3 py-1.5 rounded border border-zinc-200 dark:border-zinc-600 hover:bg-zinc-100 dark:hover:bg-zinc-800">
          &larr; back to all tools
        </button>
        <button id="theme-toggle-btn" aria-label="Toggle dark mode"
                class="flex items-center gap-2 font-mono text-xs px-3 py-1.5 rounded border border-zinc-200 dark:border-zinc-600 hover:bg-zinc-100 dark:hover:bg-zinc-800">
          <svg id="theme-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
          <span id="theme-toggle-label"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">

    <section id="view-home">
      <h1 class="font-mono font-bold text-2xl mb-1">Toolbox</h1>
      <p class="text-zinc-600 dark:text-zinc-400 mb-8">A growing collection of small web tools.</p>
      <div id="tool-card-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>
    </section>

    <section id="view-unit-converter" hidden>
      <h2 class="font-mono font-bold text-2xl mb-4">Unit Converter</h2>
      <div class="border border-zinc-200 dark:border-zinc-700 rounded p-8 text-zinc-500 dark:text-zinc-400">
        Placeholder &mdash; unit conversion tool goes here.
      </div>
    </section>

    <section id="view-color-palette" hidden>
      <h2 class="font-mono font-bold text-2xl mb-4">Color Palette Generator</h2>
      <div class="border border-zinc-200 dark:border-zinc-700 rounded p-8 text-zinc-500 dark:text-zinc-400">
        Placeholder &mdash; color palette tool goes here.
      </div>
    </section>

  </main>

<script>
  const TOOLS = [
    { id: 'unit-converter', title: 'Unit Converter', description: 'Convert between length, weight, and temperature units.',
      icon: '<rect x="3" y="7" width="18" height="10" rx="1"></rect><line x1="7" y1="7" x2="7" y2="11"></line><line x1="11" y1="7" x2="11" y2="11"></line><line x1="15" y1="7" x2="15" y2="11"></line><line x1="19" y1="7" x2="19" y2="11"></line>' },
    { id: 'color-palette', title: 'Color Palette Generator', description: 'Pick a color and generate matching shades and tints.',
      icon: '<circle cx="12" cy="12" r="9"></circle><circle cx="9" cy="10" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15" cy="9" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="16" cy="14" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="10" cy="15" r="1.3" fill="currentColor" stroke="none"></circle>' }
  ];

  function renderToolCards() {
    const grid = document.getElementById('tool-card-grid');
    grid.innerHTML = TOOLS.map(function (tool) {
      return '<a href="#/' + tool.id + '" ' +
        'class="block rounded border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-6 hover:border-zinc-400 dark:hover:border-zinc-500 transition">' +
        '<svg class="mb-3 text-zinc-700 dark:text-zinc-300" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + tool.icon + '</svg>' +
        '<h3 class="font-mono font-semibold text-lg mb-1">' + tool.title + '</h3>' +
        '<p class="text-sm text-zinc-600 dark:text-zinc-400">' + tool.description + '</p>' +
        '</a>';
    }).join('');
  }

  function getViewIdForHash(hash) {
    const slug = hash.replace(/^#\/?/, '').trim();
    if (slug === '') return 'view-home';
    const match = TOOLS.find(function (t) { return t.id === slug; });
    return match ? 'view-' + match.id : 'view-home';
  }

  function showView(viewId) {
    document.querySelectorAll('main > section').forEach(function (sec) { sec.setAttribute('hidden', ''); });
    const target = document.getElementById(viewId) || document.getElementById('view-home');
    target.removeAttribute('hidden');

    const isHome = target.id === 'view-home';
    document.getElementById('back-home-btn').hidden = isHome;

    const heading = target.querySelector('h1, h2');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus();
    }
  }

  function handleRouteChange() {
    showView(getViewIdForHash(location.hash));
  }

  function initThemeToggle() {
    const icon = document.getElementById('theme-toggle-icon');
    const label = document.getElementById('theme-toggle-label');
    const sunPaths = '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>';
    const moonPath = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>';

    function syncIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      icon.innerHTML = isDark ? moonPath : sunPaths;
      label.textContent = isDark ? 'dark' : 'light';
    }
    syncIcon();

    document.getElementById('theme-toggle-btn').addEventListener('click', function () {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      syncIcon();
    });
  }

  window.addEventListener('hashchange', handleRouteChange);
  document.getElementById('back-home-btn').addEventListener('click', function () { location.hash = '#/'; });

  document.addEventListener('DOMContentLoaded', function () {
    renderToolCards();
    handleRouteChange();
    initThemeToggle();
  });
</script>
</body>
</html>
